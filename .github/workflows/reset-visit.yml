name: reset-visit
# Undo a preview "visit" that was really us reviewing it, so the business still gets its pitch email.
# This repo is PUBLIC: enter only the first 10 characters of the token, never the whole link.
on:
  workflow_dispatch:
    inputs:
      token:
        description: "First 10 characters of the preview token (after /b/). Never the whole token: logs are public."
        required: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python scripts/reset_visit.py
        env:
          TOKEN: ${{ github.event.inputs.token }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
