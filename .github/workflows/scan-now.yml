name: scan-now
# Manual local-business scan (counts against the same daily search budget as the scheduled scan).
# Scans and builds previews only: emails go out later from audit-cron, inside each business's local hours.
on:
  workflow_dispatch:
    inputs:
      searches:
        description: "How many Google searches to run (each checks ~20 businesses)"
        required: true
        default: "5"
concurrency:
  group: audit-cron
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m creator_audit local-scan "$SEARCHES"
        env:
          SEARCHES: ${{ github.event.inputs.searches }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TZ: America/New_York
          BASE_URL: https://reelkix.com
          SITE_URL: https://reelkix.com
          BUSINESS_ADDRESS: ${{ secrets.BUSINESS_ADDRESS }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          LOCAL_CITIES: US
      - name: Latest redesign previews (private links; private repo)
        run: >
          python -c "from creator_audit import db; db.init();
          [print(r['kind'], r['site_score'], r['category'], '|', r['city'], '|', (r['site_url'] or '')[:60], '| email:', bool(r['contact_email']), '| https://reelkix.com/b/' + r['token'])
          for r in db.q(\"SELECT * FROM businesses WHERE kind='redesign' ORDER BY id DESC LIMIT 12\")]"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
