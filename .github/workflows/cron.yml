name: audit-cron
# Free scheduler for the audit backend: one pass every 3 hours on GitHub's servers (daily YouTube + Google
# scans, outreach sending inside send hours, follow-ups, outcome checks, expiry, weekly summary), then any
# queued jobs (teaser audits). It talks straight to the Neon database; the Render web service can sleep.
# Repo secrets (Settings -> Secrets and variables -> Actions): DATABASE_URL, BUSINESS_ADDRESS, ADMIN_EMAIL,
# YOUTUBE_API_KEY, GOOGLE_PLACES_API_KEY, SMTP_PASSWORD (the Resend key).
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours at :17 UTC (~8 runs/day, well inside the free minutes)
  workflow_dispatch: {}       # "Run workflow" button for a manual run
concurrency:
  group: audit-cron
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # Premium video walkthroughs (promised within 2 days): set up ffmpeg + the free Kokoro voice only when one is waiting
      - id: vids
        run: python -c "from creator_audit import db; db.init(); print('pending=%d' % db.q1(\"SELECT COUNT(*) n FROM video_jobs WHERE kind='walkthrough' AND status IN ('pending','claimed')\")['n'])" >> "$GITHUB_OUTPUT"
      - if: steps.vids.outputs.pending != '0'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements-video.txt
      - if: steps.vids.outputs.pending != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/kokoro
          key: kokoro-v1.0-int8
      - if: steps.vids.outputs.pending != '0'
        run: |
          mkdir -p ~/.cache/kokoro && cd ~/.cache/kokoro
          [ -f kokoro-v1.0.int8.onnx ] || curl -sSL -o kokoro-v1.0.int8.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
          [ -f voices-v1.0.bin ] || curl -sSL -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - run: python -m creator_audit cron 8
        env:
          CRON_VIDEOS: ${{ steps.vids.outputs.pending != '0' }}
          TZ: America/New_York
          BASE_URL: https://reelkix.com
          SITE_URL: https://reelkix.com
          WAKE_LINKS: "true"
          BUSINESS_ADDRESS: ${{ secrets.BUSINESS_ADDRESS }}
          SUPPORT_EMAIL: hello@reelkix.com
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITES_ID: ${{ secrets.NETLIFY_SITES_ID }}
          SMTP_HOST: smtp.resend.com
          SMTP_PORT: "2587"
          SMTP_USER: resend
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: Reelkix Audits <audits@notify.reelkix.com>
          OUTREACH_FROM: Reelkix <hello@notify.reelkix.com>
          OUTREACH_DAILY_SEND_LIMIT: "30"
          LOCAL_CITIES: US   # every larger city in all 50 states + DC (creator_audit/us_cities.py)
